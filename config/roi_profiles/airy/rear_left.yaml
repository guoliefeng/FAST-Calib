roi:
  enabled: true
  profile: airy_rear_left

  # Airy rear_left ROI, estimated from manually cropped board PCDs.
  # Uploaded board crops:
  #   save_data_1,2,3,8,9,10,13,14,15,16,17,18
  #
  # Board crop union approximately:
  #   x: -3.87 ~ -1.62
  #   y: -5.50 ~ -2.01
  #   z:  0.07 ~  4.35
  #
  # This coarse ROI is intentionally larger. Use it for automatic ROI extraction
  # from save_data_*/1.pcd. If it captures too much background, first inspect:
  #   _calib_output/02_roi/board_candidates/*.pcd
  # then tune x/y/z ranges below.
  coarse:
    x_min: -5
    x_max: 0.00
    y_min: -6.00
    y_max: 0
    z_min: 2.00
    z_max: 4.90
    # x_min: -4.90
    # x_max: -1.10
    # y_min: -6.10
    # y_max: -0.70
    # z_min: 1.60
    # z_max: 4.80

  padding:
    x: 0.12
    y: 0.12
    z: 0.12

  robust_quantile: [0.5, 99.5]

  detector:
    # Airy point clouds are sparse. 0.20 is more suitable than the Hesai 0.28
    # for separating the board-like component.
    cluster_grid: 0.20
    min_component_points: 40
    min_coarse_points: 40

    # The board is strongly slanted in this Airy frame; z span can be much
    # larger than Hesai board profiles.
    expected_height: 1.20
    board_span:
      x: [0.80, 2.40]
      y: [0.80, 2.30]
      z: [0.20, 3.20]
