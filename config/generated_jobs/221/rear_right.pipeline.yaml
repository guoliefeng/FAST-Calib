  bag_name: 1.bag
  image_name: img_0001.jpg
  pcd_name: 1.pcd
  board_pcd_name: board_candidate.pcd
extract_pcd:
  enabled: true
  topic_policy: unique
  frame: all
  frame_stride: 1
  max_frames: 0
  overwrite: false
fast_calib:
  package: fast_calib
  calib_launch: calib.launch
  pointcloud_source: bag
  max_single_rmse: 0.08
  max_multi_rmse: 0.03
  max_group_rmse: 0.06
  multi_min_groups: 3
  multi_mode: robust_max_groups
  config_file: /home/glf/dataDisk/calib/FAST-Calib_ws/src/FAST-Calib/config/vehicles/221/cameras/rear_right.yaml
  lidar_topic: velodyne_second
verify:
  enabled: true
  all_groups: true
  point_radius: 2
job_name: 221_rear_right
data_dir: /home/glf/dataDisk/calib/0426/data_221_rear_right
output_dir: ${data_dir}/_calib_output
roi:
  enabled: true
  profile: hesai_rear_right
  coarse:
    x_min: -3.5
    x_max: 1.8
    y_min: 2.0
    y_max: 6.2
    z_min: -1.5
    z_max: 0.5
  padding:
    x: 0.15
    y: 0.15
    z: 0.15
  robust_quantile:
  - 0.5
  - 99.5
  detector:
    cluster_grid: 0.28
    min_component_points: 80
    min_coarse_points: 80
