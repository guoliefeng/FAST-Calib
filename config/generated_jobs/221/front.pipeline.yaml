layout:
  group_prefix: save_data_
  bag_name: 1.bag
  image_name: img_0001.jpg
  pcd_name: 1.pcd
  board_pcd_name: board_candidate.pcd
extract_pcd:
  enabled: true
  topic_policy: unique
  frame: all
  frame_stride: 1
  max_frames: 0
  overwrite: false
fast_calib:
  package: fast_calib
  calib_launch: calib.launch
  pointcloud_source: bag
  lidar_center_extraction_mode: auto
  lidar_min_plane_points: 700
  lidar_template_min_ring_per_hole: 2
  lidar_template_min_outer_per_hole: 2
  lidar_template_max_inside_per_hole: 8
  lidar_template_local_refine_radius: 0.05
  lidar_template_local_refine_step: 0.01
  lidar_strict_geometry: true
  lidar_geometry_side_rel_tol: 0.18
  lidar_geometry_diag_rel_tol: 0.18
  lidar_geometry_perimeter_rel_tol: 0.18
  lidar_ransac_min_inliers: 10
  lidar_ransac_radius_tolerance: 0.02
  lidar_ransac_inlier_threshold: 0.012
  max_single_rmse: 0.08
  max_multi_rmse: 0.03
  max_group_rmse: 0.06
  multi_min_groups: 3
  multi_mode: robust_max_groups
  config_file: /home/glf/dataDisk/calib/FAST-Calib_ws/src/FAST-Calib/config/vehicles/221/cameras/front.yaml
  lidar_topic: velodyne_first
verify:
  enabled: true
  all_groups: true
  point_radius: 2
job_name: 221_front
data_dir: /home/glf/dataDisk/calib/0425/data_221
output_dir: ${data_dir}/_calib_output
roi:
  enabled: true
  profile: hesai_front
  coarse:
    x_min: 0.45
    x_max: 4
    y_min: -5
    y_max: 0.1
    z_min: -1.35
    z_max: 0.45
  padding:
    x: 0.15
    y: 0.15
    z: 0.15
  robust_quantile:
  - 0.5
  - 99.5
  detector:
    cluster_grid: 0.28
    min_component_points: 50
    min_coarse_points: 50
    expected_height: 1.0
    board_span:
      x:
      - 0.3
      - 3.2
      y:
      - 0.05
      - 3.0
      z:
      - 0.3
      - 1.8
