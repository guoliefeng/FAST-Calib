# FAST-Calib pipeline job template.
# Copy once per LiDAR-camera pair and edit data_dir, config_file, roi.coarse.
job_name: lidar_name

data_dir: /path/to/data_dir
output_dir: ${data_dir}/_calib_output

layout:
  group_prefix: save_data_
  bag_name: 1.bag
  image_name: img_0001.jpg
  pcd_name: 1.pcd
  board_pcd_name: board_candidate.pcd

extract_pcd:
  enabled: true
  topic_policy: unique
  frame: middle
  overwrite: false

roi:
  enabled: true
  profile: custom
  coarse:
    x_min: -3.0
    x_max: 3.0
    y_min: -3.0
    y_max: 3.0
    z_min: -1.5
    z_max: 0.5
  padding: {x: 0.15, y: 0.15, z: 0.15}
  robust_quantile: [0.5, 99.5]
  detector:
    cluster_grid: 0.28
    min_component_points: 80
    min_coarse_points: 80
    expected_height: 1.0
    board_span:
      x: [0.30, 5.00]
      y: [0.05, 3.00]
      z: [0.30, 1.80]

fast_calib:
  package: fast_calib
  calib_launch: calib.launch
  config_file: /path/to/fast_calib_config.yaml
  pointcloud_source: pcd
  max_single_rmse: 0.030
  max_multi_rmse: 0.030
  multi_min_groups: 3
  multi_mode: max_groups

verify:
  enabled: true
  all_groups: false
  point_radius: 2
