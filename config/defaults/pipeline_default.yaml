# Shared default pipeline settings for all vehicles and camera positions.
layout:
  group_prefix: save_data_
  bag_name: 1.bag
  image_name: img_0001.jpg
  pcd_name: 1.pcd
  board_pcd_name: board_candidate.pcd
extract_pcd:
  enabled: true
  topic_policy: unique
  # Export policy for bag -> PCD.
  #
  # Previous behavior used a single frame, usually "middle".
  # For sparse LiDARs such as Airy, a single frame often does not contain
  # enough samples around the four circular holes. Use "all" to accumulate
  # all frames from each bag into one PCD.
  #
  # Supported values:
  #   all, middle, last, or an integer frame index.
  frame: all
  frame_stride: 1
  max_frames: 0
  overwrite: false
fast_calib:
  package: fast_calib
  calib_launch: calib.launch
  pointcloud_source: bag
  # LiDAR circle-center extraction:
  #   auto     : four-hole empty-region template first, legacy RANSAC fallback
  #   template : only four-hole empty-region template
  #   ransac   : only legacy circle-candidate RANSAC
  lidar_center_extraction_mode: auto
  lidar_min_plane_points: 700
  lidar_template_min_ring_per_hole: 2
  lidar_template_min_outer_per_hole: 2
  lidar_template_max_inside_per_hole: 6
  lidar_template_max_inside_support_ratio: 0.35
  lidar_template_min_support_per_hole: 3.0
  lidar_template_local_refine_radius: 0.05
  lidar_template_local_refine_step: 0.01
  lidar_strict_geometry: true
  lidar_geometry_side_rel_tol: 0.15
  lidar_geometry_diag_rel_tol: 0.15
  lidar_geometry_perimeter_rel_tol: 0.15
  lidar_ransac_min_inliers: 12
  lidar_ransac_radius_tolerance: 0.02
  lidar_ransac_inlier_threshold: 0.010
  # If a LiDAR driver changes coordinates by +90 deg around Z
  # (x_new=-y_old, y_new=x_old), update each ROI x/y range for the new
  # coordinate frame before running calibration. The template matcher works
  # in the aligned board plane and does not hard-code any global yaw rotation.
  max_single_rmse: 0.080
  max_multi_rmse: 0.030
  max_group_rmse: 0.060
  multi_min_groups: 6
  multi_mode: robust_max_groups
verify:
  enabled: true
  all_groups: true
  point_radius: 2
