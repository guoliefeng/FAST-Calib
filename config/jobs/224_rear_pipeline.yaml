job_name: 224_rear

data_dir: /home/glf/dataDisk/calib/0427/224_rear
output_dir: ${data_dir}/_calib_output

layout:
  group_prefix: save_data_
  bag_name: 1.bag
  image_name: img_0001.jpg
  pcd_name: 1.pcd
  board_pcd_name: board_candidate.pcd

extract_pcd:
  enabled: true
  topic_policy: unique
  frame: middle
  overwrite: false

roi:
  enabled: true
  profile: rear
  coarse:
    x_min: 0.8
    x_max: 4.6
    y_min: -5.1
    y_max: 0.2
    z_min: -1.4
    z_max: 0.55
  padding:
    x: 0.15
    y: 0.15
    z: 0.15
  robust_quantile: [0.5, 99.5]
  detector:
    cluster_grid: 0.28
    min_component_points: 50
    min_coarse_points: 50
    expected_height: 1.0
    board_span:
      x: [0.3, 5.0]
      y: [0.05, 3.5]
      z: [0.3, 1.8]

fast_calib:
  package: fast_calib
  calib_launch: calib.launch

  # Temporarily reuse the corresponding 221 front/rear camera+target config.
  # Replace this config_file later with the real 224/227 intrinsics.
  config_file: /home/glf/dataDisk/calib/FAST-Calib_ws/src/FAST-Calib/config/hesai0426_rear.yaml

  # Keep the same stable workflow as before:
  # PCD is only for ROI extraction; final LiDAR circle detection uses the bag.
  pointcloud_source: bag

  max_single_rmse: 0.080
  max_multi_rmse: 0.030
  max_group_rmse: 0.060
  multi_min_groups: 3
  multi_mode: robust_max_groups

verify:
  enabled: true
  all_groups: true
  point_radius: 2
