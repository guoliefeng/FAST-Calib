job_name: airy_left_rear

data_dir: /home/glf/dataDisk/calib/0427/224_left_rear
output_dir: ${data_dir}/_calib_output

layout:
  group_prefix: save_data_
  bag_name: 1.bag
  image_name: img_0001.jpg
  pcd_name: 1.pcd
  board_pcd_name: board_candidate.pcd
  # Airy ROI is generated by scripts/detect_airy_left_rear_roi.py.
  # That script stores board candidates in 02_roi/board_candidates rather than
  # in save_data_*/board_candidate.pcd, so verification must read this path.
  board_pcd_template: ${output_dir}/02_roi/board_candidates/{group}_board_candidate.pcd

extract_pcd:
  enabled: true
  topic_policy: unique
  frame: middle
  overwrite: false

# Airy left-rear uses a custom component-based ROI extractor.
# Run scripts/detect_airy_left_rear_roi.py after extract_pcd.
# Then this stage only reuses the generated ROI yaml.
roi:
  enabled: false
  existing_file: ${output_dir}/02_roi/roi_groups.yaml

fast_calib:
  package: fast_calib
  calib_launch: calib.launch
  config_file: /home/glf/dataDisk/calib/FAST-Calib_ws/src/FAST-Calib/config/airy0427_left_rear.yaml

  # Important: use bag for final LiDAR circular-hole detection.
  # Single-frame PCD is only for ROI extraction.
  pointcloud_source: bag

  max_single_rmse: 0.080
  max_multi_rmse: 0.030
  max_group_rmse: 0.060
  multi_min_groups: 3
  multi_mode: robust_max_groups

verify:
  enabled: true
  all_groups: true
  point_radius: 2
