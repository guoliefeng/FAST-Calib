# FAST-Calib pipeline job for /home/glf/dataDisk/calib/0426/data_221_rear_right.
job_name: rear_right_0426

data_dir: /home/glf/dataDisk/calib/0426/data_221_rear_right
output_dir: ${data_dir}/_pipeline_output

layout:
  group_prefix: save_data_
  bag_name: 1.bag
  image_name: img_0001.jpg
  pcd_name: 1.pcd
  board_pcd_name: board_candidate.pcd
  board_pcd_template: board_roi_rear_right_debug/{group}_board_candidate.pcd

extract_pcd:
  enabled: false
  topic_policy: unique
  frame: middle
  overwrite: false

roi:
  enabled: false
  existing_file: ${data_dir}/board_roi_rear_right_groups.yaml
  coarse:
    x_min: -3.50
    x_max: 1.80
    y_min: 2.00
    y_max: 6.20
    z_min: -1.50
    z_max: 0.50
  padding: {x: 0.15, y: 0.15, z: 0.15}
  robust_quantile: [0.5, 99.5]
  detector:
    cluster_grid: 0.28
    min_component_points: 80
    min_coarse_points: 80
    expected_height: 1.0
    board_span:
      x: [0.30, 5.00]
      y: [0.05, 3.00]
      z: [0.30, 1.80]

fast_calib:
  package: fast_calib
  calib_launch: calib.launch
  config_file: /home/glf/dataDisk/calib/FAST-Calib_ws/src/FAST-Calib/config/hesai0426_rear_right.yaml
  pointcloud_source: bag
  lidar_topic: velodyne_second
  max_single_rmse: 0.050
  max_multi_rmse: 0.080
  multi_min_groups: 3
  multi_mode: max_groups

verify:
  enabled: true
  all_groups: false
  point_radius: 2
  grid_cols: 5
